<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember to Ocean</title>
  <meta name="description" content="Ember to Ocean: how wildfires, air quality, water condition and salmon fisheries are linked across Canada, the USA and Russia, 2012–2025. NASA Space Apps 2026.">
  <meta name="color-scheme" content="light">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script defer src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script defer src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main class="page">
    <header id="site-header" class="slot" aria-label="Site header">
      <p class="placeholder">#site-header · loading…</p>
    </header>

    <div id="year-slider" class="slot" aria-label="Year slider">
      <p class="placeholder">#year-slider · loading…</p>
    </div>

    <figure id="map" class="slot" aria-label="Map">
      <p class="placeholder">#map · loading…</p>
      <div id="map-legend" aria-label="Map legend"></div>
    </figure>

    <figure id="fig1" class="slot" aria-label="Figure 1, trend">
      <p class="placeholder">#fig1 · Fig. 1 trend · loading…</p>
    </figure>

    <figure id="fig2" class="slot" aria-label="Figure 2, before and after">
      <p class="placeholder">#fig2 · Fig. 2 before / after · loading…</p>
    </figure>

    <aside id="infobox" class="slot" aria-label="Infobox">
      <p class="placeholder">#infobox · loading…</p>
    </aside>

    <figure id="fig3" class="slot" aria-label="Figure 3, the chain">
      <p class="placeholder">#fig3 · Fig. 3 chain · loading…</p>
    </figure>

    <article id="methods" class="slot" aria-label="Methods">
      <p class="placeholder">#methods · loading…</p>
    </article>
  </main>
  <noscript><p class="placeholder">Ember to Ocean needs JavaScript to load its data files.</p></noscript>
</body>
</html>
