<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Minimalist basketball line art, tiled behind the boxes (css/layout.css). Kept faint on purpose so text and plots stay readable. -->
  <g fill="none" stroke="#8C7550" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.17">
    <!-- ball -->
    <g transform="translate(96 100)">
      <circle r="34"/>
      <path d="M0 -34V34M-34 0H34"/>
      <path d="M-24 -24Q-10 0 -24 24M24 -24Q10 0 24 24"/>
    </g>
    <!-- shot arc from ball to hoop -->
    <path d="M136 78Q220 -6 300 78" stroke-dasharray="2 7"/>
    <!-- hoop, backboard and net -->
    <g transform="translate(336 98)">
      <rect x="-26" y="-30" width="52" height="34" rx="4"/>
      <rect x="-10" y="-12" width="20" height="14" rx="2"/>
      <path d="M0 4V13"/>
      <ellipse cy="18" rx="18" ry="5"/>
      <path d="M-18 18L-12 46M-9 22L-6 48M0 23V49M9 22L6 48M18 18L12 46M-14 32H14M-12 42H12"/>
    </g>
    <!-- key, free-throw circle and baseline -->
    <g transform="translate(150 360)">
      <path d="M-70 60H70"/>
      <rect x="-30" y="-40" width="60" height="100"/>
      <path d="M-30 -40A30 30 0 0 1 30 -40"/>
      <path d="M-30 -40A30 30 0 0 0 30 -40" stroke-dasharray="5 5"/>
      <path d="M-14 60A14 14 0 0 1 14 60"/>
    </g>
    <!-- small tilted ball -->
    <g transform="translate(372 352) rotate(25) scale(0.7)">
      <circle r="34"/>
      <path d="M0 -34V34M-34 0H34"/>
      <path d="M-24 -24Q-10 0 -24 24M24 -24Q10 0 24 24"/>
    </g>
  </g>
</svg>
